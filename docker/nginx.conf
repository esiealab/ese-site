server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    include /etc/nginx/security-headers.conf;

    # Doublon des redirections déclarées dans astro.config.mjs : si le site part
    # sur un autre hébergeur, les pages de redirection de dist/ suffisent.
    location = /editions { return 301 /archives/; }
    location = /editions/ { return 301 /archives/; }
    # Guillemets obligatoires : nginx lit un `{` nu dans une regex comme un
    # début de bloc et refuse de démarrer.
    location ~ "^/editions/(\d{4})/?$" { return 301 /archives/$1/; }

    # Fichiers hashés par Astro : immuables.
    location /_astro/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        add_header Cache-Control "public, must-revalidate, max-age=600" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
