name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom de l'image suit le dépôt : pas de propriétaire codé en dur,
      # le transfert vers l'organisation ne demande aucune modification ici.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # Construite et éprouvée localement d'abord : publier une image qui ne
      # démarre pas serait pire que ne rien publier. Le second build réutilise
      # le cache, il ne recompile rien.
      - name: Construire l'image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ese-site:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier qu'elle démarre et sert les en-têtes
        run: |
          docker run -d --name ese-candidate -p 8080:8080 ese-site:candidate
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8080/; then
            echo "::error::l'image ne répond pas, publication annulée"
            docker logs ese-candidate
            exit 1
          fi
          headers=$(curl -sS -I http://127.0.0.1:8080/)
          for h in "X-Content-Type-Options" "Referrer-Policy" "Content-Security-Policy"; do
            if ! grep -qi "^$h:" <<< "$headers"; then
              echo "::error::en-tête $h absent, publication annulée"
              exit 1
            fi
          done
          docker rm -f ese-candidate

      - name: Publier sur GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
