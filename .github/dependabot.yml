version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
    ignore:
      # @astrojs/check déclare `typescript: ^5 || ^6`. Une majeure de TypeScript
      # fait échouer `npm ci` sur un conflit de peer dependency (constaté en CI
      # avec la 7.0.2). À rouvrir quand @astrojs/check l'acceptera.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
