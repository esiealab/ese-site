intro: >-
  Depuis 2013, l'ESIEA Secure Edition est une journée de conférences traitant de
  la cybersécurité. Elle s'est tenue le samedi 17 juin 2023 de 10h à 18h dans les
  locaux parisiens de l'ESIEA. L'inscription de 10 EUR comprenait l'accès à la
